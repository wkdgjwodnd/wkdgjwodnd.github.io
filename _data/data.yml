  title: Career Profile
  summary: |
    차량 내부 네트워크(Automotive Ethernet, CAN) 및 임베디드 시스템 보안을
    집중 연구해 온 보안 연구원입니다. SOME/IP 인증·암호화 프로토콜 개선,
