career-profile:
  title: Career Profile
  summary: |
    M.S-level researcher specialised in **in-vehicle network security**.
    Designed a domain-key–based secure **SOME/IP** protocol, built ML-based
    IDS for Automotive Ethernet & ROS, and filed 7 security-related patents.
    Comfortable with C/C++, Python, ROS 2, vsomeip, Wireshark & Scapy.
    Passionate about turning research outcomes into production-grade secure
    mobility solutions.

